<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf7f2"><title>Baby Hub</title><style>
:root{--cream:#fbf7f2;--paper:#fffdfb;--ink:#4b3934;--muted:#8d7d77;--rose:#f8e8e5;--sage:#edf4eb;--brown:#9b715f;--sand:#f3e9de;--line:#eadfd7;--shadow:0 8px 28px rgba(91,66,55,.07)}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#fcf8f4,#f7f3ee);margin:0;color:var(--ink)}button,input,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:18px}.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;font-size:31px}.muted{color:var(--muted);font-size:13px}.card,.item{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:var(--shadow)}.login{max-width:390px;margin:55px auto}.login input,.login button{width:100%;min-height:48px;margin:5px 0}.primary{background:var(--brown);color:#fff;border:0}.nav{display:flex;gap:7px;overflow:auto;padding:12px 0 6px;position:sticky;top:0;background:rgba(251,247,242,.94);backdrop-filter:blur(10px);z-index:4}.nav button,.chip,button,input,select{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;color:var(--ink)}.nav button{white-space:nowrap}.nav .active{background:var(--brown);color:#fff;border-color:var(--brown)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.save{color:#668064;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stats .card{margin:0;box-shadow:none}.stats .card:nth-child(1){background:var(--rose)}.stats .card:nth-child(2){background:var(--sage)}.stats .card:nth-child(3),.stats .card:nth-child(4){background:var(--sand)}.value{font-size:23px;font-weight:800;margin-top:4px}.hero{background:linear-gradient(135deg,var(--rose),var(--sage));padding:20px}.hero h2{margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.progress{height:9px;background:#eee5de;border-radius:20px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:#8ba18a}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls input{flex:1;min-width:220px}.item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;box-shadow:none}.item.done{background:var(--sage)}.item.off{opacity:.5}.item input[type=checkbox]{width:23px;height:23px;accent-color:#789477}.item-title{font-weight:750}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.chip{padding:4px 8px;font-size:12px;background:#fff}.detail{grid-column:2/4}.slider{display:flex;gap:8px;align-items:center;margin-top:9px}.slider input[type=range]{flex:1;accent-color:var(--brown)}.price{width:95px;direction:ltr}.flags{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.flags label{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff}.section-title{margin:20px 2px 8px}.safety{border-right:5px solid #d7a88f}.error{color:#a44}.link{color:#775647;text-decoration:underline}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:700px){.wrap{padding:10px}.brand h1{font-size:27px}.stats{grid-template-columns:1fr 1fr}.value{font-size:20px}.grid{grid-template-columns:1fr}.item{padding:13px 11px}.detail{grid-column:1/4}.controls input,.controls select{min-height:46px}.nav{margin:0 -10px;padding:10px}.brand .muted{display:none}}
</style></head><body><div class="wrap"><div class="brand"><div><h1>Baby Hub</h1><div class="muted">כל ההכנות לבייבי במקום אחד</div></div><span id="saved" class="save"></span></div>
<div id="login" class="card login"><h2>כניסה</h2><input id="email" type="email" placeholder="אימייל"><input id="password" type="password" placeholder="סיסמה"><button class="primary" onclick="signIn()">התחברות</button><div id="err" class="error"></div></div>
<div id="main" hidden><div class="top"><span id="who" class="muted"></span><button onclick="signOut()">התנתק</button></div><nav class="nav" id="nav"></nav><main id="view"></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://xewoeopijjgaaqqcyqnp.supabase.co","sb_publishable_lYL_i6R15m7h6a9OcMbxlg_OkUfAQDA");
let rows=[],checks=[],safety=[],page="home",rt=null,filter="",category="";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=n=>"₪"+Number(n||0).toLocaleString("he-IL",{maximumFractionDigits:2});
const kind=r=>["task","packing"].includes(r.type)?r.type:"product",need=r=>r.needs_purchase==null?kind(r)==="product":!!r.needs_purchase;
const price=r=>r.gift?0:(r.actual_price==null?(+r.min_price+(+r.max_price-+r.min_price)*(+r.slider/100)):+r.actual_price);
const norm=r=>({...r,min_price:+r.min_price,max_price:+r.max_price,slider:+r.slider,enabled:!!r.enabled,purchased:!!r.purchased,gift:!!r.gift,completed:!!r.completed,needs_purchase:r.needs_purchase==null?true:!!r.needs_purchase,archived:!!r.archived});
function nav(){const tabs=[["home","🏠 ראשי"],["budget","💰 תקציב"],["prep","✓ הכנות"],["bag","👜 תיק לידה"],["checks","🩺 בדיקות"],["safety","🛟 בטיחות"]];$("nav").innerHTML=tabs.map(([p,t])=>'<button class="'+(page===p?'active':'')+'" onclick="go(\''+p+'\')">'+t+'</button>').join("")}
function go(p){page=p;filter="";category="";nav();render()}
async function signIn(){err.textContent="";const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)err.textContent=error.message}
async function signOut(){await sb.auth.signOut()}
async function enter(u){login.hidden=true;main.hidden=false;who.textContent=u.email||"";const [a,b,c]=await Promise.all([sb.from("baby_budget_items").select("*").order("id"),sb.from("pregnancy_checks").select("*").order("id"),sb.from("safety_notes").select("*").order("id")]);if(a.error){view.innerHTML='<div class="card error">'+esc(a.error.message)+'</div>';return}rows=(a.data||[]).map(norm);checks=b.data||[];safety=c.data||[];nav();render();realtime()}
function leave(){if(rt){sb.removeChannel(rt);rt=null}login.hidden=false;main.hidden=true}
function realtime(){if(rt)sb.removeChannel(rt);rt=sb.channel("baby-hub-v2").on("postgres_changes",{event:"UPDATE",schema:"public",table:"baby_budget_items"},x=>{const i=rows.findIndex(r=>r.id===x.new.id);if(i>=0){rows[i]=norm({...rows[i],...x.new});render()}}).on("postgres_changes",{event:"UPDATE",schema:"public",table:"pregnancy_checks"},x=>{const i=checks.findIndex(r=>r.id===x.new.id);if(i>=0){checks[i]=x.new;render()}}).subscribe()}
async function save(table,id,fields){saved.textContent="שומר…";const {error}=await sb.from(table).update(fields).eq("id",id);saved.textContent=error?"שגיאה":"✓ נשמר";setTimeout(()=>saved.textContent="",900)}
function stats(){const a=rows.filter(r=>!r.archived&&r.enabled&&kind(r)!=="task"&&need(r));return {total:a.reduce((s,r)=>s+price(r),0),spent:rows.filter(r=>r.purchased).reduce((s,r)=>s+price(r),0),min:a.reduce((s,r)=>s+(r.gift?0:r.min_price),0),max:a.reduce((s,r)=>s+(r.gift?0:r.max_price),0)}}
function statCards(){const s=stats();return '<div class="stats">'+[["תקציב נבחר",s.total],["הוצאנו",s.spent],["מינימום",s.min],["מקסימום",s.max]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="value">'+money(x[1])+'</div></div>').join("")+'</div>'}
function pct(done,total){return total?Math.round(done/total*100):0}
function home(){const active=rows.filter(r=>!r.archived),prep=active.filter(r=>kind(r)==="task"),bag=active.filter(r=>kind(r)==="packing"),next=checks.find(r=>!r.completed);const pd=prep.filter(r=>r.completed).length,bd=bag.filter(r=>r.completed).length,cd=checks.filter(r=>r.completed).length;return '<div class="card hero"><h2>מרכז ההכנות שלכם 👶</h2><div>קניות, הכנות, תיק לידה ובדיקות — מסונכרן לשניכם בזמן אמת.</div></div>'+statCards()+'<div class="grid"><div class="card"><b>✓ הכנות לפני הלידה</b><div class="value">'+pd+' / '+prep.length+'</div><div class="progress"><i style="width:'+pct(pd,prep.length)+'%"></i></div></div><div class="card"><b>👜 תיק לידה</b><div class="value">'+bd+' / '+bag.length+'</div><div class="progress"><i style="width:'+pct(bd,bag.length)+'%"></i></div></div><div class="card"><b>🩺 מעקב בדיקות</b><div class="value">'+cd+' / '+checks.length+'</div><div class="progress"><i style="width:'+pct(cd,checks.length)+'%"></i></div></div><div class="card"><b>הבא בתור</b><div class="value" style="font-size:18px">'+esc(next?next.test_name:"הכול מסומן ✓")+'</div>'+(next?'<div class="muted">'+esc(next.test_date_text||next.week_text||"ללא תאריך")+'</div>':"")+'</div></div>'}
function filters(list){const cats=[...new Set(list.map(r=>r.category))];return '<div class="controls"><input placeholder="חיפוש..." value="'+esc(filter)+'" oninput="filter=this.value;render()"><select onchange="category=this.value;render()"><option value="">כל הקטגוריות</option>'+cats.map(c=>'<option '+(category===c?'selected':'')+'>'+esc(c)+'</option>').join("")+'</select></div>'}
function rowItem(r,mode){const isBudget=mode==="budget",done=isBudget?r.purchased:r.completed;let detail='<div class="meta"><span class="chip">'+esc(r.category)+'</span>'+(r.type?'<span class="chip">'+(kind(r)==="task"?"משימה":kind(r)==="packing"?"אריזה":"קנייה")+'</span>':"")+'</div>';if(isBudget&&need(r)){detail+='<div class="slider">'+(r.min_price===r.max_price?"":'<input type="range" min="0" max="100" value="'+r.slider+'" onchange="setSlider('+r.id+',this.value)">')+'<input class="price" type="number" min="0" step=".01" value="'+Number(price(r).toFixed(2))+'" '+(r.gift?"disabled":"")+' onchange="setPrice('+r.id+',this.value)"></div><div class="flags"><label><input type="checkbox" '+(r.purchased?"checked":"")+' onchange="toggleRow('+r.id+',\'purchased\',this.checked)"> קניתי</label><label><input type="checkbox" '+(r.gift?"checked":"")+' onchange="toggleRow('+r.id+',\'gift\',this.checked)"> מתנה</label></div>'}return '<div class="item '+(done?"done ":"")+(isBudget&&!r.enabled?"off":"")+'"><input type="checkbox" '+(isBudget?(r.enabled?"checked":""):(r.completed?"checked":""))+' onchange="toggleRow('+r.id+',\''+(isBudget?"enabled":"completed")+'\',this.checked)"><div><div class="item-title">'+esc(r.item)+'</div>'+detail+'</div><b>'+(isBudget&&need(r)?money(price(r)):(done?"✓":""))+'</b></div>'}
function listPage(mode){let list=rows.filter(r=>!r.archived);if(mode==="budget")list=list.filter(r=>kind(r)!=="task"&&need(r));if(mode==="prep")list=list.filter(r=>kind(r)==="task"||(kind(r)==="product"&&!need(r)));if(mode==="bag")list=list.filter(r=>kind(r)==="packing");const f=filter.toLowerCase();list=list.filter(r=>(!f||r.item.toLowerCase().includes(f))&&(!category||r.category===category));return (mode==="budget"?statCards():"")+filters(rows.filter(r=>!r.archived))+(list.length?list.map(r=>rowItem(r,mode)).join(""):'<div class="empty">אין פריטים להצגה</div>')}
function checksPage(){return '<div class="card"><b>מעקב הריון</b><div class="muted">המידע כאן הועתק מהטאב "בדיקות" בקובץ שסיפקתם. הוא לא תחליף להנחיות הצוות הרפואי.</div></div>'+["שליש ראשון","שליש שני","שליש שלישי"].map(t=>{const a=checks.filter(x=>x.trimester===t);return '<h3 class="section-title">'+t+'</h3>'+a.map(x=>'<div class="item '+(x.completed?'done':'')+'"><input type="checkbox" '+(x.completed?'checked':'')+' onchange="toggleCheck('+x.id+',this.checked)"><div><div class="item-title">'+esc(x.test_name)+'</div><div class="meta">'+(x.week_text?'<span class="chip">שבוע '+esc(x.week_text)+'</span>':'')+(x.test_date_text?'<span class="chip">'+esc(x.test_date_text)+'</span>':'')+(x.date_window?'<span class="chip">'+esc(x.date_window)+'</span>':'')+'</div></div><b>'+(x.completed?'✓':'')+'</b></div>').join("")}).join("")}
function safetyPage(){return '<div class="card"><b>הערות בטיחות מהקובץ</b><div class="muted">מוצגות כפי שנשמרו במקור, יחד עם קישור המקור כשקיים.</div></div>'+safety.map(x=>'<div class="card safety"><b>'+esc(x.topic)+'</b><p>'+esc(x.important)+'</p>'+(x.impact?'<div class="muted">'+esc(x.impact)+'</div>':'')+(x.source_url?'<p><a class="link" href="'+esc(x.source_url)+'" target="_blank" rel="noopener">מקור מקצועי ↗</a></p>':'')+'</div>').join("")}
function render(){if(page==="home")view.innerHTML=home();else if(page==="budget")view.innerHTML=listPage("budget");else if(page==="prep")view.innerHTML=listPage("prep");else if(page==="bag")view.innerHTML=listPage("bag");else if(page==="checks")view.innerHTML=checksPage();else view.innerHTML=safetyPage()}
function toggleRow(id,k,v){const r=rows.find(x=>x.id===id);if(!r)return;r[k]=v;render();save("baby_budget_items",id,{[k]:v})}
function toggleCheck(id,v){const r=checks.find(x=>x.id===id);if(!r)return;r.completed=v;render();save("pregnancy_checks",id,{completed:v})}
function setSlider(id,v){const r=rows.find(x=>x.id===id);if(!r)return;r.slider=+v;r.actual_price=null;render();save("baby_budget_items",id,{slider:r.slider,actual_price:null})}
function setPrice(id,v){const r=rows.find(x=>x.id===id),n=Number(v);if(!r||!Number.isFinite(n)||n<0)return;r.actual_price=n;render();save("baby_budget_items",id,{actual_price:n})}
(async()=>{const {data:{session}}=await sb.auth.getSession();session?await enter(session.user):leave();sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT")leave();if(ev==="SIGNED_IN"&&s)enter(s.user)})})();
</script></body></html>
