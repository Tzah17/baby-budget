<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby Budget</title><style>
:root{--cream:#fbf7f2;--paper:#fffdfb;--ink:#4b3934;--muted:#8d7d77;--rose:#e8b8b8;--rose2:#f8e8e5;--sage:#b9cbb8;--sage2:#edf4eb;--brown:#a77d68;--sand:#ead9c8;--line:#eadfd7;--shadow:0 8px 28px rgba(91,66,55,.07)}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#fcf8f4,#f7f3ee);margin:0;color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:24px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand h1{margin:0;font-size:34px;letter-spacing:-1px}.brand small{color:var(--muted)}.card,.row{background:rgba(255,253,251,.94);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stats .card:nth-child(1){background:var(--rose2)}.stats .card:nth-child(2){background:var(--sage2)}.stats .card:nth-child(3){background:#f6efe7}.stats .card:nth-child(4){background:#eef1e8}.value{font-size:25px;font-weight:800;margin-top:5px}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.controls input{flex:1;min-width:220px}input,button,select{padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit}button{cursor:pointer;font-weight:650}.primary{background:var(--brown);color:white;border-color:var(--brown)}.logout{background:transparent}.row{display:grid;grid-template-columns:36px minmax(240px,1.5fr) 110px minmax(180px,1fr) 170px;gap:14px;align-items:center;transition:.15s}.row:hover{transform:translateY(-1px)}.off{opacity:.48}.bought{background:var(--sage2);border-color:#d3e1d0}.gift{background:#fbf0eb;border-color:#efd5ca}.muted{color:var(--muted);font-size:12px}.login{max-width:400px;margin:50px auto}.error{color:#a44}.slider input[type=range]{accent-color:var(--brown);width:100%}.flags{display:flex;gap:10px}.flags label{white-space:nowrap}input[type=checkbox]{accent-color:#789477}.save-pill{min-width:72px;color:#668064;font-weight:650}.top-actions{margin-top:0}.category-label{font-size:12px;color:var(--muted);margin-top:3px}
@media(max-width:750px){body{font-size:16px}.wrap{padding:12px}.brand{align-items:flex-start;margin:4px 2px 12px}.brand h1{font-size:28px}.brand small{display:none}.stats{grid-template-columns:1fr 1fr;gap:8px}.stats .card{margin:0;padding:12px;border-radius:15px;box-shadow:none}.value{font-size:20px}.controls{gap:8px;margin:10px 0}.controls input,.controls select,.controls button{min-height:46px;font-size:16px}.controls input{width:100%;flex-basis:100%}.top-actions{justify-content:space-between}.top-actions #who{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row{display:grid;grid-template-columns:36px 1fr auto;gap:8px;padding:14px 12px;margin:8px 0;border-radius:16px;box-shadow:none}.row>input[type=checkbox]{width:24px;height:24px}.row>b{font-size:18px}.slider{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:4px 2px 0}.slider input[type=range]{width:100%;height:34px}.flags{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;gap:8px}.flags label{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.72);font-weight:650}.flags input{width:21px;height:21px}.login{margin:24px auto}.login input,.login button{min-height:48px;font-size:16px}.muted{font-size:13px}}
</style></head><body><div class="wrap"><div class="brand"><div><h1>Baby Budget</h1><small>התקציב והרשימה שלנו לקראת הבייבי</small></div></div><div id="login" class="card login"><h2>כניסה</h2><input id="email" type="email" placeholder="אימייל" style="width:100%;box-sizing:border-box;margin-bottom:8px"><input id="password" type="password" placeholder="סיסמה" style="width:100%;box-sizing:border-box;margin-bottom:8px"><button class="primary" onclick="signIn()">התחברות</button><div id="err" class="error"></div></div><div id="main" hidden><div class="controls top-actions"><span id="who" class="muted"></span><span id="saved" class="save-pill"></span><button class="logout" onclick="signOut()">התנתק</button></div><div class="stats"><div class="card"><div class="muted">תקציב נבחר</div><div class="value" id="total">₪0</div></div><div class="card"><div class="muted">הוצאנו עד כה</div><div class="value" id="spent">₪0</div></div><div class="card"><div class="muted">מינימום</div><div class="value" id="minimum">₪0</div></div><div class="card"><div class="muted">מקסימום</div><div class="value" id="maximum">₪0</div></div></div><div class="controls"><input id="q" placeholder="חיפוש..." oninput="render()"><select id="cat" onchange="render()"><option value="">כל הקטגוריות</option></select></div><div id="items"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://xewoeopijjgaaqqcyqnp.supabase.co";
const SUPABASE_KEY="sb_publishable_lYL_i6R15m7h6a9OcMbxlg_OkUfAQDA";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[];
const money=n=>"₪"+Math.round(n||0).toLocaleString("he-IL");const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function p(r){return r.gift?0:r.min_price+(r.max_price-r.min_price)*(r.slider/100)}
async function signIn(){err.textContent="";const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)err.textContent=error.message}
async function signOut(){await sb.auth.signOut()}
async function enter(u){login.hidden=true;main.hidden=false;who.textContent=u.email||"";const {data,error}=await sb.from("baby_budget_items").select("*").order("id");if(error){items.innerHTML='<div class="card error">'+e(error.message)+'</div>';return}rows=(data||[]).map(r=>({...r,min_price:+r.min_price,max_price:+r.max_price,slider:+r.slider,enabled:!!r.enabled,purchased:!!r.purchased,gift:!!r.gift}));cat.innerHTML='<option value="">כל הקטגוריות</option>'+[...new Set(rows.map(r=>r.category))].map(x=>'<option>'+e(x)+'</option>').join("");render()}
function leave(){login.hidden=false;main.hidden=true}
async function save(r,fields){saved.textContent="שומר…";const {error}=await sb.from("baby_budget_items").update(fields).eq("id",r.id);saved.textContent=error?"שגיאה בשמירה":"✓ נשמר";setTimeout(()=>saved.textContent="",1000)}
function render(){const s=q.value.toLowerCase(),c=cat.value,f=rows.filter(r=>(!s||r.item.toLowerCase().includes(s))&&(!c||r.category===c));items.innerHTML=f.map(r=>'<div class="row '+(!r.enabled?'off ':'')+(r.purchased?'bought ':'')+(r.gift?'gift':'')+'"><input type="checkbox" '+(r.enabled?'checked':'')+' onchange="toggle('+r.id+',\'enabled\',this.checked)"><div><b>'+e(r.item)+'</b><div class="muted">'+e(r.category)+'</div></div><b>'+money(r.enabled?p(r):0)+'</b><div class="slider">'+(r.min_price===r.max_price?'מחיר קבוע':'<input type="range" min="0" max="100" value="'+r.slider+'" onchange="setSlider('+r.id+',this.value)">')+'</div><div class="flags"><label><input type="checkbox" '+(r.purchased?'checked':'')+' onchange="toggle('+r.id+',\'purchased\',this.checked)"> קניתי</label> <label><input type="checkbox" '+(r.gift?'checked':'')+' onchange="toggle('+r.id+',\'gift\',this.checked)"> מתנה</label></div></div>').join("");const a=rows.filter(r=>r.enabled);total.textContent=money(a.reduce((x,r)=>x+p(r),0));minimum.textContent=money(a.reduce((x,r)=>x+(r.gift?0:r.min_price),0));maximum.textContent=money(a.reduce((x,r)=>x+(r.gift?0:r.max_price),0));spent.textContent=money(rows.filter(r=>r.purchased).reduce((x,r)=>x+p(r),0))}
function toggle(id,k,v){const r=rows.find(x=>x.id===id);if(!r)return;r[k]=v;render();save(r,{[k]:v})}
function setSlider(id,v){const r=rows.find(x=>x.id===id);if(!r)return;r.slider=+v;render();save(r,{slider:r.slider})}
(async()=>{const {data:{session}}=await sb.auth.getSession();session?await enter(session.user):leave();sb.auth.onAuthStateChange((event,s)=>{if(event==="SIGNED_OUT")leave();if(event==="SIGNED_IN"&&s)enter(s.user)})})();
</script></body></html>
