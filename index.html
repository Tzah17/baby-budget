<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby Budget</title><style>body{font-family:Arial,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.wrap{max-width:1100px;margin:auto;padding:20px}.card,.row{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.value{font-size:24px;font-weight:800}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input{flex:1;min-width:200px}input,button,select{padding:10px;border:1px solid #ddd;border-radius:8px}button{cursor:pointer}.primary{background:#5b5bd6;color:white}.row{display:grid;grid-template-columns:30px 1.5fr 100px 1fr 150px;gap:10px;align-items:center}.off{opacity:.5}.bought{background:#f1fbf7}.gift{background:#fff8e8}.muted{color:#777;font-size:12px}.login{max-width:400px;margin:50px auto}.error{color:#b42318}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:28px 1fr 90px}.slider,.flags{grid-column:2/4}}</style></head><body><div class="wrap"><h1>Baby Budget</h1><div id="login" class="card login"><h2>כניסה</h2><input id="email" type="email" placeholder="אימייל" style="width:100%;box-sizing:border-box;margin-bottom:8px"><input id="password" type="password" placeholder="סיסמה" style="width:100%;box-sizing:border-box;margin-bottom:8px"><button class="primary" onclick="signIn()">התחברות</button><div id="err" class="error"></div></div><div id="main" hidden><div class="controls"><span id="who" class="muted"></span><button onclick="signOut()">התנתק</button><button onclick="exportCsv()">ייצא CSV</button><span id="saved" class="muted"></span></div><div class="stats"><div class="card"><div class="muted">תקציב נבחר</div><div class="value" id="total">₪0</div></div><div class="card"><div class="muted">הוצאנו עד כה</div><div class="value" id="spent">₪0</div></div><div class="card"><div class="muted">מינימום</div><div class="value" id="minimum">₪0</div></div><div class="card"><div class="muted">מקסימום</div><div class="value" id="maximum">₪0</div></div></div><div class="controls"><input id="q" placeholder="חיפוש..." oninput="render()"><select id="cat" onchange="render()"><option value="">כל הקטגוריות</option></select></div><div id="items"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://xewoeopijjgaaqqcyqnp.supabase.co";
const SUPABASE_KEY="sb_publishable_lYL_i6R15m7h6a9OcMbxlg_OkUfAQDA";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[];
const money=n=>"₪"+Math.round(n||0).toLocaleString("he-IL");const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function p(r){return r.gift?0:r.min_price+(r.max_price-r.min_price)*(r.slider/100)}
async function signIn(){err.textContent="";const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)err.textContent=error.message}
async function signOut(){await sb.auth.signOut()}
async function enter(u){login.hidden=true;main.hidden=false;who.textContent=u.email||"";const {data,error}=await sb.from("baby_budget_items").select("*").order("id");if(error){items.innerHTML='<div class="card error">'+e(error.message)+'</div>';return}rows=(data||[]).map(r=>({...r,min_price:+r.min_price,max_price:+r.max_price,slider:+r.slider,enabled:!!r.enabled,purchased:!!r.purchased,gift:!!r.gift}));cat.innerHTML='<option value="">כל הקטגוריות</option>'+[...new Set(rows.map(r=>r.category))].map(x=>'<option>'+e(x)+'</option>').join("");render()}
function leave(){login.hidden=false;main.hidden=true}
async function save(r,fields){saved.textContent="שומר...";const {error}=await sb.from("baby_budget_items").update(fields).eq("id",r.id);saved.textContent=error?"שגיאה: "+error.message:"נשמר";setTimeout(()=>saved.textContent="",1000)}
function render(){const s=q.value.toLowerCase(),c=cat.value,f=rows.filter(r=>(!s||r.item.toLowerCase().includes(s))&&(!c||r.category===c));items.innerHTML=f.map(r=>'<div class="row '+(!r.enabled?'off ':'')+(r.purchased?'bought ':'')+(r.gift?'gift':'')+'"><input type="checkbox" '+(r.enabled?'checked':'')+' onchange="toggle('+r.id+',\'enabled\',this.checked)"><div><b>'+e(r.item)+'</b><div class="muted">'+e(r.category)+'</div></div><b>'+money(r.enabled?p(r):0)+'</b><div class="slider">'+(r.min_price===r.max_price?'מחיר קבוע':'<input type="range" min="0" max="100" value="'+r.slider+'" oninput="slide('+r.id+',this.value)"> '+r.slider+'%')+'</div><div class="flags"><label><input type="checkbox" '+(r.purchased?'checked':'')+' onchange="toggle('+r.id+',\'purchased\',this.checked)"> קניתי</label> <label><input type="checkbox" '+(r.gift?'checked':'')+' onchange="toggle('+r.id+',\'gift\',this.checked)"> מתנה</label></div></div>').join("");const a=rows.filter(r=>r.enabled);total.textContent=money(a.reduce((x,r)=>x+p(r),0));minimum.textContent=money(a.reduce((x,r)=>x+(r.gift?0:r.min_price),0));maximum.textContent=money(a.reduce((x,r)=>x+(r.gift?0:r.max_price),0));spent.textContent=money(rows.filter(r=>r.purchased).reduce((x,r)=>x+p(r),0))}
function toggle(id,k,v){const r=rows.find(x=>x.id===id);r[k]=v;render();save(r,{[k]:v})}function slide(id,v){const r=rows.find(x=>x.id===id);r.slider=+v;render();clearTimeout(r.t);r.t=setTimeout(()=>save(r,{slider:r.slider}),350)}
function exportCsv(){const h=["id","item","category","min_price","max_price","slider","enabled","type","purchased","gift"],x=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},txt=[h.join(","),...rows.map(r=>h.map(k=>x(["enabled","purchased","gift"].includes(k)?(r[k]?1:0):r[k])).join(","))].join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+txt],{type:"text/csv"}));a.download="baby_budget_backup.csv";a.click()}
(async()=>{const {data:{session}}=await sb.auth.getSession();session?enter(session.user):leave();sb.auth.onAuthStateChange((_,s)=>s?enter(s.user):leave())})();
</script></body></html>
